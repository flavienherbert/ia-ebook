<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accès à ton guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#FBFBFD;color:#1C1D24;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
  .box{max-width:440px}
  .spin{width:42px;height:42px;border:3px solid #EEEFF3;border-top-color:#5B54E6;border-radius:50%;margin:0 auto 22px;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  h1{font-size:24px;margin:0 0 10px;letter-spacing:-.02em}
  p{color:#737984;font-size:16px;line-height:1.6;margin:0 0 20px}
  a{display:inline-block;background:#5B54E6;color:#fff;text-decoration:none;font-weight:600;padding:13px 26px;border-radius:11px;font-size:15px}
  .dot{color:#DD8B26}
  @media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
  <div class="box" id="box">
    <div class="spin"></div>
    <h1>Vérification du paiement<span class="dot">…</span></h1>
    <p>Un instant, on débloque ton guide.</p>
  </div>

<script>
  const box=document.getElementById('box');
  const id=new URLSearchParams(location.search).get('session_id');

  function fail(msg){
    box.innerHTML='<h1>Accès non confirmé</h1><p>'+msg+'</p><a href="/index.html">Retour à la page d\u2019achat</a>';
  }

  if(!id){
    fail('Cette page n\u2019est accessible qu\u2019après un achat.');
  }else{
    fetch('/api/unlock?session_id='+encodeURIComponent(id))
      .then(function(r){ if(r.ok) return r.text(); return r.text().then(function(t){throw new Error(t);}); })
      .then(function(html){ document.open(); document.write(html); document.close(); })
      .catch(function(e){ fail(e.message||'Paiement introuvable. Si tu viens de payer, réessaie dans quelques secondes.'); });
  }
</script>
</body>
</html>
